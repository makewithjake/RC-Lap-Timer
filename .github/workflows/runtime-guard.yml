name: Runtime Guard

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check duplicate runtime modules
        run: bash scripts/check-runtime-duplicates.sh

      - name: Ensure app entrypoint stays in app/js
        run: |
          if ! grep -q '<script type="module" src="js/app.js"></script>' app/index.html; then
            echo "[guard] app/index.html must load app/js/app.js (via src=\"js/app.js\")."
            exit 1
          fi
